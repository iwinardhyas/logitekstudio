<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // QR laporan Otopantau lama (logitekstudio.my.id/otopantau/r/<kode>) → subdomain verifikasi.
      // Halaman ini juga dipakai sebagai 404.html, jadi semua path /otopantau/* lewat sini.
      (function () {
        var m = location.pathname.match(/^\/otopantau(\/.*)?$/);
        if (m) location.replace('https://otopantau.logitekstudio.my.id' + (m[1] || '/') + location.search + location.hash);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1E293B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Logitek Studio membangun aplikasi mobile dan web untuk pekerjaan nyata di lapangan: alat kerja inspektor, sistem laporan, dan dashboard admin." />
    <title>Logitek Studio | Solusi Digital untuk Bisnis yang Terus Tumbuh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
